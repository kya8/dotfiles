name: checks

on:
  push:
    branches: [ "master" ]
    paths:
#     - "setup.sh"
      - "bin/*.sh"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v7

      - name: Get shellcheck
        run: |
          curl --tlsv1.2 -sSfOL https://github.com/koalaman/shellcheck/releases/download/stable/shellcheck-stable.linux.x86_64.tar.xz
          tar -xf shellcheck-stable.linux.x86_64.tar.xz shellcheck-stable/shellcheck --strip-components=1

      - name: Check sh scripts
        run: |
          ./shellcheck bin/*.sh

      - name: Test setup.sh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh
          ./setup.sh -d
          ./setup.sh
          ./setup.sh -d -f
          ./setup.sh -f
